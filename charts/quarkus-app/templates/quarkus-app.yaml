apiVersion: apps/v1
kind: Deployment
metadata:
  name: vm-test-app
  namespace: victoria-test-app
spec:
  replicas: 1
  selector:
    matchLabels:
      app: vm-test-app
  template:
    metadata:
      labels:
        app: vm-test-app
    spec:
      containers:
        - name: vm-test-app
          image: quay.io/tpolacek/vm-test-app:1.0.1
          ports:
            - containerPort: 8080
---
apiVersion: v1
kind: Service
metadata:
  name: vm-test-app
  namespace: victoria-test-app
spec:
  selector:
    app: vm-test-app
  ports:
    - protocol: TCP
      port: 8080
      targetPort: 8080
