{{- range .Values.grafana.datasources }}
---
apiVersion: grafana.integreatly.org/v1beta1
kind: GrafanaDatasource
metadata:
  name: {{ .name }}-datasource
  namespace: {{ $.Values.namespace }}
  annotations:
    argocd.argoproj.io/sync-wave: "2"
  labels:
    app.kubernetes.io/name: grafana-datasource
    app.kubernetes.io/instance: {{ .name }}-datasource
    {{- with $.Values.commonLabels }}
    {{- toYaml . | nindent 4 }}
    {{- end }}
spec:
  instanceSelector:
    matchLabels:
      dashboards: "grafana"
  {{- if .plugins }}
  plugins:
    {{- toYaml .plugins | nindent 4 }}
  {{- end }}
  datasource:
    name: {{ .name }}
    type: {{ .type }}
    url: {{ .url }}
    access: {{ .access | default "proxy" }}
    isDefault: {{ .isDefault | default false }}
{{- end }}
